name = "qalbie"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (Vite build output)
[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# Build-time env vars untuk Vite (VITE_* prefix)
# Setelah deploy, buka Cloudflare Dashboard:
#   Pages project → Settings → Environment Variables → Add variables di sini
# Vars ini hanya bisa diinjeksi saat BUILD, bukan runtime untuk static sites.
